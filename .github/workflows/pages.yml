name: Deploy Infallyn to GitHub Pages

# index.html is already the generated single file, so there is no build step:
# this only publishes the app surface (index.html, manifest, assets) from main.
#
# Pages must be switched on once by a repo admin (Settings -> Pages ->
# Source: GitHub Actions). Creating the Pages site is admin-only and cannot be
# done by the Actions token, so instead of failing on every push this workflow
# detects that case, posts a notice, and skips. It deploys automatically as
# soon as Pages is enabled.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages site found."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages not enabled::Turn it on at Settings -> Pages -> Source: GitHub Actions. This workflow will deploy on the next push or manual run."
          fi

      - name: Configure Pages
        if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Stage site (app only)
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html manifest.webmanifest _site/
          cp -r assets _site/assets
          touch _site/.nojekyll
          # Sanity: the single-file build must actually be the app.
          grep -q "Infallyn" _site/index.html

      - name: Upload artifact
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
